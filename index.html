<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Hub</title>

<style>
body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    margin: 20px;
}

.menu {
    margin-bottom: 10px;
}

button {
    padding: 12px 18px;
    margin: 8px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #1e90ff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0f6cd1;
}

iframe {
    width: 100%;
    height: 85vh;
    border: none;
    background: black;
}
</style>

</head>
<body>

<h1>My Game Hub</h1>

<div class="menu">
    <button onclick="loadGame('Run1/index.html')">Run 1</button>
    <button onclick="loadGame('Run2/index.html')">Run 2</button>
    <button onclick="loadGame('Run3/index.html')">Run 3</button>
</div>

<iframe id="gameFrame"></iframe>

<script>
function loadGame(path) {
    document.getElementById("gameFrame").src = path;
}
</script>

</body>
</html>
